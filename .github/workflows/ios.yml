name: build-ipa
on:
  push:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
jobs:
  ipa:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: |
          xcodebuild -project CowDash.xcodeproj -scheme CowDash -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/CowDash.app Payload/
          zip -qr CowDash-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: CowDash-ipa
          path: ios/CowDash-unsigned.ipa
